# ===== ledgerly v1 =====
p1v1_n1:
  notable: p1v1_e_money (Entity)
  path: '["amount"]'
  body: An integer in the currency's smallest unit. 1250 EUR is €12.50, and 1250 JPY is ¥1250 — the yen has no minor unit.

