  code: '200'
  note: Every charge on the account
  output: "[Charge]"
p1v1_charges_create_201:
  endpoint: p1v1_charges_create
  code: '201'
  note: The charge was accepted and is being settled
  output: Charge
p1v1_charges_create_400:
