<%
  # The three schemas rc14 pins lines against. A snapshot is the stored string,
  # so a thread whose snapshot is one of the `_was` values reads as outdated.
  patch_input = "{email?:string,name?:string,default_payment_method_id:(string|null),metadata?:[{key:string,value:string}]}"
  patch_input_was = "{email?:string,name?:string,default_payment_method_id:(string|null)}"
  charge_root = "{id:string,amount:Money,status:string,refunded:boolean,description:(string|null),customer_id:(string|null),payment_method:(PaymentMethod|null),created_at:string}"
  charge_root_was = "{id:string,amount:Money,status:string,refunded:boolean,customer_id:(string|null),created_at:string}"
%>

