# ===== v1 =====
p1v1_users_list:
  http_verb: verb_get
  path: /users
  version: project1v1
  note: "List all users"
p1v1_users_create:
  http_verb: verb_post
  path: /users
  version: project1v1
  note: "Create a new user"
  input: "{email:string,name:string,password:string}"
p1v1_users_get:
  http_verb: verb_get
  path: /users/me
  version: project1v1
  note: "Get the current user"
p1v1_users_delete:
  http_verb: verb_delete
  path: /users/me
  version: project1v1
  note: "Delete the current user"
  input: "{reason:string,confirm:boolean}"
p1v1_sessions_create:
  http_verb: verb_post
  path: /sessions
  version: project1v1
  note: "Log in with email and password"
  input: "{email:string,password:string}"

