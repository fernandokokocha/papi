# ===== ledgerly v1 =====
p1v1_charges_list:
  http_verb: verb_get
  path: "/charges"
  version: p1v1
  auth: ''
  input: ''
  note: List charges, newest first
p1v1_charges_create:
  http_verb: verb_post
  path: "/charges"
  version: p1v1
  auth: ''
  input: "{amount:number,currency:string,source:string}"
